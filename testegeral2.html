<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singularity Dynamics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #fff;
        }
        canvas { display: block; }
        #overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.6) 100%);
            z-index: 10;
        }
        .header { text-align: center; }
        .title {
            font-size: 1.2rem;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 300;
            opacity: 0.9;
        }
        .status-pill {
            display: inline-block;
            padding: 6px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            opacity: 0.6;
            letter-spacing: 1px;
        }
        .metric { margin-bottom: 6px; }
        .val { color: #00f3ff; font-weight: bold; transition: color 1.5s ease; }
        #vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 50%, black 150%);
            pointer-events: none;
            z-index: 5;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>
</head>
<body>

<div id="vignette"></div>
<div id="overlay">
    <div class="header">
        <div class="title" id="main-title">Quantum Superposition</div>
        <div class="status-pill" id="status-text">Harmonic Resonance: Active</div>
    </div>
    <div class="hud-bottom">
        <div>
            <div class="metric">FIELD_MODE: <span class="val" id="mode-val">WAVE_FUNCTION</span></div>
            <div class="metric">SYMMETRY: <span class="val" id="sym-val">QUADRUPOLE</span></div>
        </div>
        <div style="text-align: right">
            <div class="metric">RELATIVITY: <span class="val" id="vel-val">0.32c</span></div>
            <div class="metric">FIELD_FLUX: <span class="val" id="flux-val">STABLE</span></div>
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import gsap from 'gsap';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(60, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.03;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    const noiseChunk = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
            const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 = v - i + dot(i, C.xxx) ;
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }
    `;

    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const bhGeo = new THREE.SphereGeometry(4, 64, 64);
    coreGroup.add(new THREE.Mesh(bhGeo, bhMat));

    const auraMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uIntensity: { value: 1.0 }, uColor: { value: new THREE.Color("#00f3ff") } },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vView = normalize(-(modelViewMatrix * vec4(position, 1.0)).xyz);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uIntensity;
            uniform vec3 uColor;
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
                float rim = pow(1.0 - max(dot(vNormal, vView), 0.0), 4.0);
                gl_FragColor = vec4(uColor * rim * uIntensity * 4.0, 1.0);
            }
        `,
        side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending
    });
    coreGroup.add(new THREE.Mesh(new THREE.SphereGeometry(4.25, 64, 64), auraMat));

    const instanceCount = 6000;
    const streakGeo = new THREE.CylinderGeometry(0.01, 0.12, 2.2, 3);
    streakGeo.rotateX(Math.PI / 2);

    const diskMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uWaveAmp: { value: 3.5 },
            uJetStretch: { value: 0.0 },
            uSpiralTwist: { value: 0.0 },
            uIntensity: { value: 1.0 },
            uOrbitScale: { value: 1.0 },
            uPrimaryColor: { value: new THREE.Color("#00f3ff") },
            uSecondaryColor: { value: new THREE.Color("#7000ff") }
        },
        vertexShader: `
            ${noiseChunk}
            uniform float uTime;
            uniform float uWaveAmp;
            uniform float uJetStretch;
            uniform float uSpiralTwist;
            uniform float uIntensity;
            uniform float uOrbitScale;
            uniform vec3 uPrimaryColor;
            uniform vec3 uSecondaryColor;
            
            varying vec3 vColor;
            varying float vOpacity;

            void main() {
                vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                float rOriginal = length(instPos.xz);
                float initialAngle = atan(instPos.z, instPos.x);

                // Velocidade orbital proporcional à distância
                float orbitalVelocity = (2.0 / sqrt(max(rOriginal, 1.0))) * uOrbitScale;
                float currentAngle = initialAngle + (uTime * orbitalVelocity);

                // --- TRANSFORMAÇÃO 1: ONDA DE RESSONÂNCIA (Quantum Wave) ---
                float wave = sin(currentAngle * 4.0 + uTime * 2.0) * cos(rOriginal * 0.3);
                vec3 posWave = vec3(cos(currentAngle) * rOriginal, instPos.y + wave * uWaveAmp, sin(currentAngle) * rOriginal);

                // --- TRANSFORMAÇÃO 2: JATO POLAR RELATIVÍSTICO (Polar Jet Outflow) ---
                // Contração radial para formar um pilar estreito + Expansão vertical extrema no eixo Y
                float jetRadius = rOriginal * (0.15 + 0.85 * (1.0 - uJetStretch));
                float jetY = instPos.y + sign(instPos.y + 0.001) * (rOriginal * 2.5 * uJetStretch);
                vec3 posJet = vec3(cos(currentAngle) * jetRadius, jetY, sin(currentAngle) * jetRadius);

                // --- TRANSFORMAÇÃO 3: ESPIRAL DE CISALHAMENTO (Logarithmic Maelstrom) ---
                float spiralAngle = currentAngle + (15.0 / (rOriginal + 2.0)) * uSpiralTwist;
                float noiseDisp = snoise(vec3(instPos.x * 0.1, instPos.z * 0.1, uTime * 0.5));
                vec3 posSpiral = vec3(cos(spiralAngle) * rOriginal, instPos.y + noiseDisp * uSpiralTwist * 3.0, sin(spiralAngle) * rOriginal);

                // Interpolação suave dos 3 estados geométricos
                vec3 morphedWorldPos = posWave;
                morphedWorldPos = mix(morphedWorldPos, posJet, uJetStretch);
                morphedWorldPos = mix(morphedWorldPos, posSpiral, uSpiralTwist);

                // Efeito Doppler óptico baseado na direção da visualização da câmera
                vec3 viewDir = normalize(cameraPosition - morphedWorldPos);
                vec3 orbitDir = normalize(vec3(-sin(currentAngle), 0.0, cos(currentAngle)));
                float doppler = dot(orbitDir, viewDir);

                // Gradiente de cor dinâmico
                vec3 color = mix(uSecondaryColor, uPrimaryColor, smoothstep(40.0, 5.0, rOriginal));
                vColor = color * (1.2 + doppler * 0.6) * uIntensity;

                // Opacidade progressiva
                vOpacity = smoothstep(3.0, 6.0, length(morphedWorldPos)) * (1.0 - smoothstep(40.0, 55.0, rOriginal)) * 0.85;

                // Rotação individual da malha da partícula
                float deltaAngle = currentAngle - initialAngle;
                float c = cos(deltaAngle);
                float s = sin(deltaAngle);
                mat3 rotY = mat3(c, 0, s, 0, 1, 0, -s, 0, c);
                vec3 localPos = (instanceMatrix * vec4(position, 0.0)).xyz;
                vec3 rotatedLocalPos = rotY * localPos;

                gl_Position = projectionMatrix * viewMatrix * vec4(morphedWorldPos + rotatedLocalPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                gl_FragColor = vec4(vColor, vOpacity);
            }
        `,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });

    const instancedDisk = new THREE.InstancedMesh(streakGeo, diskMaterial, instanceCount);
    const dummy = new THREE.Object3D();

    for (let i = 0; i < instanceCount; i++) {
        const r = 4.5 + Math.pow(Math.random(), 1.2) * 42;
        const angle = Math.random() * Math.PI * 2;
        // Distribuição levemente deslocada do plano zero para dar volume
        const h = (Math.random() - 0.5) * (6 / (r * 0.2));
        
        dummy.position.set(Math.cos(angle) * r, h, Math.sin(angle) * r);
        dummy.lookAt(dummy.position.x + Math.sin(angle), dummy.position.y, dummy.position.z - Math.cos(angle));
        dummy.updateMatrix();
        instancedDisk.setMatrixAt(i, dummy.matrix);
    }
    scene.add(instancedDisk);

    // Configuração dos 3 novos modos de animação
    const config = [
        { 
            title: "Quantum Superposition", status: "Harmonic Resonance: Active", 
            mode: "WAVE_FUNCTION", sym: "QUADRUPOLE", vel: "0.32c", flux: "STABLE",
            waveAmp: 3.5, jetStretch: 0.0, spiralTwist: 0.0, intensity: 1.0, rotate: 0.4, camY: 30, camDist: 85, orbit: 1.0,
            primaryColor: "#00f3ff", secondaryColor: "#7000ff"
        },
        { 
            title: "Relativistic Jet", status: "Polar Outflow: Critical", 
            mode: "COLLIMATED_JET", sym: "AXIAL_AXIS", vel: "0.94c", flux: "EXTREME",
            waveAmp: 0.0, jetStretch: 1.0, spiralTwist: 0.0, intensity: 2.2, rotate: 1.8, camY: 10, camDist: 105, orbit: 2.5,
            primaryColor: "#ff0055", secondaryColor: "#ffaa00"
        },
        { 
            title: "Ergosphere Shear", status: "Maelstrom Distortion: High", 
            mode: "LOG_SPIRAL", sym: "ASYMMETRIC", vel: "0.78c", flux: "TURBULENT",
            waveAmp: 0.5, jetStretch: 0.0, spiralTwist: 1.0, intensity: 1.6, rotate: 3.5, camY: 55, camDist: 75, orbit: 1.8,
            primaryColor: "#00ff88", secondaryColor: "#0055ff"
        }
    ];

    let stateIdx = 0;
    const mainTitle = document.getElementById('main-title');
    const statusText = document.getElementById('status-text');
    const modeVal = document.getElementById('mode-val');
    const symVal = document.getElementById('sym-val');
    const velVal = document.getElementById('vel-val');
    const fluxVal = document.getElementById('flux-val');
    const camControl = { distance: 85 };

    function transition() {
        stateIdx = (stateIdx + 1) % config.length;
        const s = config[stateIdx];
        const tl = gsap.timeline({ defaults: { duration: 3.5, ease: "power3.inOut" } });

        // Interpolação contínua de parâmetros nos shaders
        tl.to(diskMaterial.uniforms.uWaveAmp, { value: s.waveAmp }, 0);
        tl.to(diskMaterial.uniforms.uJetStretch, { value: s.jetStretch }, 0);
        tl.to(diskMaterial.uniforms.uSpiralTwist, { value: s.spiralTwist }, 0);
        tl.to(diskMaterial.uniforms.uIntensity, { value: s.intensity }, 0);
        tl.to(diskMaterial.uniforms.uOrbitScale, { value: s.orbit }, 0);
        
        // Animação de cores
        const targetPrimary = new THREE.Color(s.primaryColor);
        const targetSecondary = new THREE.Color(s.secondaryColor);
        tl.to(diskMaterial.uniforms.uPrimaryColor.value, { r: targetPrimary.r, g: targetPrimary.g, b: targetPrimary.b }, 0);
        tl.to(diskMaterial.uniforms.uSecondaryColor.value, { r: targetSecondary.r, g: targetSecondary.g, b: targetSecondary.b }, 0);
        tl.to(auraMat.uniforms.uColor.value, { r: targetPrimary.r, g: targetPrimary.g, b: targetPrimary.b }, 0);
        tl.to(auraMat.uniforms.uIntensity, { value: s.intensity }, 0);

        // Câmera e controles
        tl.to(controls, { autoRotateSpeed: s.rotate }, 0);
        tl.to(camera.position, { y: s.camY }, 0);
        tl.to(camControl, { distance: s.camDist }, 0);

        // Atualização da UI HUD
        gsap.to([mainTitle, statusText, '.val'], { opacity: 0, duration: 0.6, onComplete: () => {
            mainTitle.innerText = s.title;
            statusText.innerText = s.status;
            statusText.style.color = s.primaryColor;
            statusText.style.borderColor = s.primaryColor;
            
            modeVal.innerText = s.mode;
            symVal.innerText = s.sym;
            velVal.innerText = s.vel;
            fluxVal.innerText = s.flux;

            document.querySelectorAll('.val').forEach(el => el.style.color = s.primaryColor);

            gsap.to([mainTitle, statusText, '.val'], { opacity: 1, duration: 0.8 });
        }});
    }

    setInterval(transition, 9000);

    const clock = new THREE.Clock();
    function animate() {
        const time = clock.getElapsedTime();
        diskMaterial.uniforms.uTime.value = time;
        auraMat.uniforms.uTime.value = time;
        
        instancedDisk.rotation.y += 0.0003;

        // Atualização do zoom/distância da câmera dinamicamente
        const currentDir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
        camera.position.x = controls.target.x + currentDir.x * camControl.distance;
        camera.position.z = controls.target.z + currentDir.z * camControl.distance;

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
