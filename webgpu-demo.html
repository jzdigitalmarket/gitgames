<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU + WGSL Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0b0c10; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #fallback {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: #ff4d4d;
      text-align: center; border: 1px solid #ff4d4d; padding: 20px; border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="fallback">WebGPU não é suportado por este navegador ou placa de vídeo.</div>
  <canvas id="gpu-canvas"></canvas>

  <script type="module">
    async function initWebGPU() {
      const canvas = document.getElementById('gpu-canvas');
      const fallback = document.getElementById('fallback');

      if (!navigator.gpu) {
        fallback.style.display = 'block';
        return;
      }

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        fallback.textContent = 'Nenhum adaptador de GPU adequado foi encontrado.';
        fallback.style.display = 'block';
        return;
      }

      const device = await adapter.requestDevice();
      const context = canvas.getContext('webgpu');
      const format = navigator.gpu.getPreferredCanvasFormat();

      // Ajusta resolução nativa conforme o High DPI do monitor
      const devicePixelRatio = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;

      context.configure({ device, format, alphaMode: 'premultiplied' });

      // Shader escrito em WGSL (Vertex + Fragment)
      const shaderCode = `
        struct VertexOutput {
          @builtin(position) position : vec4<f32>,
          @location(0) color : vec4<f32>,
        };

        @vertex
        fn vs_main(@builtin(vertex_index) vertexIndex : u32) -> VertexOutput {
          var pos = array<vec2<f32>, 3>(
            vec2<f32>( 0.0,  0.6),
            vec2<f32>(-0.6, -0.6),
            vec2<f32>( 0.6, -0.6)
          );
          var cols = array<vec3<f32>, 3>(
            vec3<f32>(0.0, 1.0, 0.8), // Cyan
            vec3<f32>(0.5, 0.0, 1.0), // Purple
            vec3<f32>(1.0, 0.2, 0.5)  // Pink
          );

          var output : VertexOutput;
          output.position = vec4<f32>(pos[vertexIndex], 0.0, 1.0);
          output.color = vec4<f32>(cols[vertexIndex], 1.0);
          return output;
        }

        @fragment
        fn fs_main(@location(0) color : vec4<f32>) -> @location(0) vec4<f32> {
          return color;
        }
      `;

      const shaderModule = device.createShaderModule({ code: shaderCode });
      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: shaderModule, entryPoint: 'vs_main' },
        fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format }] },
        primitive: { topology: 'triangle-list' }
      });

      function render() {
        const commandEncoder = device.createCommandEncoder();
        const textureView = context.getCurrentTexture().createView();

        const renderPass = commandEncoder.beginRenderPass({
          colorAttachments: [{
            view: textureView,
            clearValue: { r: 0.04, g: 0.05, b: 0.07, a: 1.0 },
            loadOp: 'clear',
            storeOp: 'store'
          }]
        });

        renderPass.setPipeline(pipeline);
        renderPass.draw(3, 1, 0, 0);
        renderPass.end();

        device.queue.submit([commandEncoder.finish()]);
      }

      render();
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth * devicePixelRatio;
        canvas.height = window.innerHeight * devicePixelRatio;
        render();
      });
    }

    initWebGPU();
  </script>
</body>
</html>
