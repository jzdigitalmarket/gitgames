<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5000 Colunas de Cores - Alta Performance (Canvas)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      background-color: #0f0f12;
      color: #ffffff;
      user-select: none;
    }

    /* Interface de controle flutuante */
    .controls {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 24, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .controls label {
      font-size: 13px;
      font-weight: 500;
      color: #a0a0b0;
      margin-right: 4px;
    }

    .controls select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .controls select:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Canvas full screen */
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* Tooltip / Status da coluna em destaque */
    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(18, 18, 24, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-family: monospace;
      color: #e0e0e0;
      pointer-events: none;
      z-index: 100;
    }

    .info-panel span {
      color: #4da6ff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="controls">
    <label for="patternSelect">Padrão Visual (5.000 Colunas):</label>
    <select id="patternSelect">
      <option value="rainbow">Arco-Íris Contínuo (0° - 360°)</option>
      <option value="multiOnda">Ondas Espectrais (Frequência Alta)</option>
      <option value="sinePlasma">Plasma Senoidal Interativo</option>
      <option value="cyberpunk">Cyberpunk Neon (Rosa / Ciano / Roxo)</option>
      <option value="goldGradient">Monocromático Ouro & Carbono</option>
    </select>
  </div>

  <div class="info-panel" id="infoPanel">Mova o cursor sobre o padrão | <span>Total: 5.000 colunas</span></div>

  <canvas id="colorCanvas"></canvas>

  <script>
    const canvas = document.getElementById('colorCanvas');
    const ctx = canvas.getContext('2d');
    const select = document.getElementById('patternSelect');
    const infoPanel = document.getElementById('infoPanel');
    
    const TOTAL_COLUMNS = 5000;
    let hoveredIndex = -1;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawPattern();
    }

    function getColor(index, pattern) {
      let hue, saturation, lightness;

      switch(pattern) {
        case 'rainbow': {
          hue = (index / TOTAL_COLUMNS) * 360;
          return `hsl(${hue}, 85%, 50%)`;
        }
        case 'multiOnda': {
          hue = ((index / TOTAL_COLUMNS) * 360 * 12) % 360;
          lightness = 45 + Math.sin(index * 0.01) * 15;
          return `hsl(${hue}, 90%, ${lightness}%)`;
        }
        case 'sinePlasma': {
          hue = (180 + Math.sin(index * 0.005) * 120 + Math.cos(index * 0.015) * 60) % 360;
          lightness = 40 + Math.sin(index * 0.02) * 20;
          return `hsl(${hue}, 95%, ${lightness}%)`;
        }
        case 'cyberpunk': {
          const t = index / TOTAL_COLUMNS;
          hue = 180 + Math.sin(t * Math.PI * 6) * 140;
          saturation = 85 + Math.cos(t * Math.PI * 4) * 15;
          return `hsl(${hue}, ${saturation}%, 55%)`;
        }
        case 'goldGradient': {
          lightness = 5 + (index / TOTAL_COLUMNS) * 75;
          hue = 40 + Math.sin(index * 0.008) * 10;
          return `hsl(${hue}, 85%, ${lightness}%)`;
        }
        default:
          return '#ffffff';
      }
    }

    function drawPattern() {
      const width = canvas.width;
      const height = canvas.height;
      const colWidth = width / TOTAL_COLUMNS;
      const pattern = select.value;

      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < TOTAL_COLUMNS; i++) {
        const x = i * colWidth;
        const color = getColor(i, pattern);

        ctx.fillStyle = color;
        // Desenha a coluna (usa x estendido ligeiramente para evitar lacunas de subpixel)
        ctx.fillRect(x, 0, colWidth + 0.5, height);

        // Highlight na coluna sob o mouse
        if (i === hoveredIndex) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.fillRect(x - colWidth * 2, 0, colWidth * 5, height);
        }
      }
    }

    // Gerenciamento de eventos
    window.addEventListener('resize', resizeCanvas);

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const colWidth = canvas.width / TOTAL_COLUMNS;
      
      const newIndex = Math.floor(mouseX / colWidth);

      if (newIndex >= 0 && newIndex < TOTAL_COLUMNS && newIndex !== hoveredIndex) {
        hoveredIndex = newIndex;
        const color = getColor(hoveredIndex, select.value);
        infoPanel.innerHTML = `Coluna: <span>${hoveredIndex + 1}</span> / 5.000 | Cor: <span>${color}</span>`;
        drawPattern();
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hoveredIndex = -1;
      infoPanel.innerHTML = `Mova o cursor sobre o padrão | <span>Total: 5.000 colunas</span>`;
      drawPattern();
    });

    select.addEventListener('change', drawPattern);

    // Renderização inicial
    resizeCanvas();
  </script>
</body>
</html>
