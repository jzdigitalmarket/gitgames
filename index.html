<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperdimensional Core</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;800&family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
            user-select: none;
        }

        canvas#webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Overlay Futurista / HUD */
        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            background: radial-gradient(circle at center, transparent 40%, rgba(2, 2, 5, 0.8) 100%);
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #a5a5bb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #00f3ff;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .controls-hint {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: #8a8a9e;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .controls-hint:hover {
            border-color: rgba(0, 243, 255, 0.4);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
        }

        .hero-center {
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }

        .hero-headline {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 20px;
            opacity: 0.95;
        }

        .hero-headline span {
            color: #00f3ff;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
        }

        .action-btn {
            pointer-events: auto;
            display: inline-block;
            margin-top: 25px;
            padding: 16px 42px;
            background: #ffffff;
            color: #000000;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }

        .hud-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #5d5d75;
        }

        .metric-val {
            color: #00f3ff;
            font-weight: 700;
        }

        /* Custom Vignette & Scanlines */
        .scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            #ui-layer { padding: 25px; }
            .hero-headline { font-size: 2.4rem; }
            .brand-title { font-size: 1.5rem; }
        }
    </style>

    <!-- ES Module Shims & Import Map -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>
</head>
<body>

    <canvas id="webgl"></canvas>
    <div class="scanlines"></div>

    <div id="ui-layer">
        <div class="brand-header">
            <div>
                <div class="brand-title">JZ Digital</div>
                <div class="brand-subtitle" id="core-state-text">State // Quantum Idle</div>
            </div>
            <div class="controls-hint">Mova o cursor para interagir</div>
        </div>

        <div class="hero-center">
            <h1 class="hero-headline">Engenharia Digital de <span>Alta Performance</span></h1>
            <button class="action-btn" id="trigger-state">Alterar Dimensão</button>
        </div>

        <div class="hud-footer">
            <div>CORE_FREQ: <span class="metric-val" id="freq-val">432.8 Hz</span></div>
            <div>PARTICLES: <span class="metric-val">12,000 GPU Mesh</span></div>
            <div>LATENCY: <span class="metric-val">0.02 ms</span></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import gsap from 'gsap';

        // --- 1. CONFIGURAÇÃO BASE DA CENA ---
        const canvas = document.getElementById('webgl');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;

        // --- 2. SHADER DE RUÍDO SIMPLEX 3D ---
        const noiseShaderChunk = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }
        `;

        // --- 3. NÚCLEO ORB (CORE SPHERE) ---
        const coreGeo = new THREE.IcosahedronGeometry(6, 64);
        const coreMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uDisplacement: { value: 1.2 },
                uColorA: { value: new THREE.Color("#00f3ff") },
                uColorB: { value: new THREE.Color("#7000ff") },
                uMouse: { value: new THREE.Vector2(0, 0) }
            },
            vertexShader: `
                ${noiseShaderChunk}
                uniform float uTime;
                uniform float uDisplacement;
                uniform vec2 uMouse;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vNoise;

                void main() {
                    vNormal = normal;
                    vec3 pos = position;
                    
                    // Distorção com ruído baseado em tempo e posição do mouse
                    float noise = snoise(pos * 0.25 + vec3(uTime * 0.4) + vec3(uMouse * 0.5, 0.0));
                    vNoise = noise;
                    
                    pos += normal * noise * uDisplacement;
                    vPosition = pos;

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColorA;
                uniform vec3 uColorB;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vNoise;

                void main() {
                    // Fresnel Effect para brilho de borda
                    vec3 viewDir = normalize(cameraPosition - vPosition);
                    float fresnel = pow(1.0 - max(dot(vNormal, viewDir), 0.0), 3.0);

                    vec3 baseColor = mix(uColorA, uColorB, vNoise * 0.5 + 0.5);
                    vec3 finalColor = baseColor + vec3(fresnel * 1.5);

                    gl_FragColor = vec4(finalColor, 0.9);
                }
            `,
            transparent: true,
            wireframe: true
        });

        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        // --- 4. CAMPO DE PARTÍCULAS INSTANCIADAS (INSTANCED MESH) ---
        const particleCount = 12000;
        const particleGeo = new THREE.TetrahedronGeometry(0.12, 0);
        
        const particleMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMorph: { value: 0 },
                uColor: { value: new THREE.Color("#00f3ff") }
            },
            vertexShader: `
                ${noiseShaderChunk}
                uniform float uTime;
                uniform float uMorph;
                uniform vec3 uColor;
                varying vec3 vColor;

                void main() {
                    vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                    vec3 pos = instPos.xyz;

                    // Dinâmica Orbital
                    float angle = atan(pos.z, pos.x) + uTime * (15.0 / length(pos.xz));
                    float radius = length(pos.xz);
                    
                    // Morfismo entre Torus e Esfera Expandida
                    vec3 targetPos = vec3(cos(angle) * radius, pos.y + sin(uTime + radius) * 2.0, sin(angle) * radius);
                    
                    // Adiciona ruído de turbulência
                    float n = snoise(targetPos * 0.08 + uTime * 0.2);
                    targetPos += n * uMorph * 4.0;

                    vColor = uColor * (1.2 + n * 0.5);

                    vec3 localPos = (instanceMatrix * vec4(position, 1.0)).xyz;
                    gl_Position = projectionMatrix * viewMatrix * vec4(targetPos + localPos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    gl_FragColor = vec4(vColor, 0.7);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        const instancedParticles = new THREE.InstancedMesh(particleGeo, particleMat, particleCount);
        const dummy = new THREE.Object3D();

        for (let i = 0; i < particleCount; i++) {
            const r = 10 + Math.pow(Math.random(), 2) * 35;
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * Math.PI;

            dummy.position.set(
                r * Math.cos(theta) * Math.cos(phi),
                (Math.random() - 0.5) * 8,
                r * Math.sin(theta) * Math.cos(phi)
            );

            dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            dummy.scale.setScalar(0.5 + Math.random() * 1.5);
            dummy.updateMatrix();
            instancedParticles.setMatrixAt(i, dummy.matrix);
        }
        scene.add(instancedParticles);

        // --- 5. INTERAÇÃO COM O MOUSE (PARALLAX + INTERACTIVE) ---
        const mouse = new THREE.Vector2();
        const targetMouse = new THREE.Vector2();

        window.addEventListener('mousemove', (e) => {
            targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // --- 6. TRANSIÇÕES DE ESTADO COM GSAP ---
        const states = [
            {
                name: "State // Quantum Idle",
                disp: 1.2,
                morph: 0.5,
                colorA: "#00f3ff",
                colorB: "#7000ff",
                wireframe: true,
                freq: "432.8 Hz",
                camDist: 50
            },
            {
                name: "State // Relativistic Fusion",
                disp: 3.5,
                morph: 2.5,
                colorA: "#ff0055",
                colorB: "#ffaa00",
                wireframe: false,
                freq: "891.2 Hz",
                camDist: 38
            },
            {
                name: "State // Hyper-Dimensional",
                disp: 0.4,
                morph: 4.0,
                colorA: "#00ff88",
                colorB: "#0066ff",
                wireframe: true,
                freq: "1204.0 Hz",
                camDist: 65
            }
        ];

        let currentState = 0;
        const btn = document.getElementById('trigger-state');
        const stateText = document.getElementById('core-state-text');
        const freqText = document.getElementById('freq-val');

        btn.addEventListener('click', () => {
            currentState = (currentState + 1) % states.length;
            const st = states[currentState];

            // Animação GSAP nos Uniforms do Shader
            gsap.to(coreMat.uniforms.uDisplacement, { value: st.disp, duration: 2, ease: "power3.inOut" });
            gsap.to(particleMat.uniforms.uMorph, { value: st.morph, duration: 2.5, ease: "power2.inOut" });

            // Transição de Cores
            const cA = new THREE.Color(st.colorA);
            const cB = new THREE.Color(st.colorB);
            gsap.to(coreMat.uniforms.uColorA.value, { r: cA.r, g: cA.g, b: cA.b, duration: 2 });
            gsap.to(coreMat.uniforms.uColorB.value, { r: cB.r, g: cB.g, b: cB.b, duration: 2 });
            gsap.to(particleMat.uniforms.uColor.value, { r: cA.r, g: cA.g, b: cA.b, duration: 2 });

            // Movimento de Câmera em Profundidade
            gsap.to(camera.position, { z: st.camDist, duration: 2.5, ease: "power2.inOut" });

            // Troca de Estilo
            coreMat.wireframe = st.wireframe;

            // UI
            gsap.to([stateText, freqText], { opacity: 0, duration: 0.3, onComplete: () => {
                stateText.innerText = st.name;
                freqText.innerText = st.freq;
                gsap.to([stateText, freqText], { opacity: 1, duration: 0.5 });
            }});
        });

        // --- 7. LOOP DE ANIMAÇÃO ---
        const clock = new THREE.Clock();

        function animate() {
            const time = clock.getElapsedTime();

            // Interpolação suave do mouse (Lerp)
            mouse.x += (targetMouse.x - mouse.x) * 0.05;
            mouse.y += (targetMouse.y - mouse.y) * 0.05;

            // Atualização de Uniforms
            coreMat.uniforms.uTime.value = time;
            coreMat.uniforms.uMouse.value = mouse;
            particleMat.uniforms.uTime.value = time;

            // Rotação sutil da cena
            coreMesh.rotation.y = time * 0.15;
            coreMesh.rotation.x = mouse.y * 0.5;
            instancedParticles.rotation.y = -time * 0.05;

            // Parallax leve da câmera
            camera.position.x += (mouse.x * 5 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y * 5 - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // Resizing Responsivo
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
